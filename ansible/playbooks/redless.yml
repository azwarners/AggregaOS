- name: Install or remove Redless
  hosts: aggregare
  become: true
  vars:
    python_app_id: redless
    python_app_version: source-16bb8dd
    python_app_source: https://github.com/azwarners/Redless.git
    python_app_ref: 16bb8dd2d68582a55394075dfb7fbf5bb2924385
    python_app_module: minisweagent
  tasks:
  - name: Install Redless from its pinned upstream source
    ansible.builtin.import_role:
      name: python_app
