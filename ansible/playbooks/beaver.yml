- name: Install or remove Beaver Habit Tracker
  hosts: aggregare
  become: true
  vars:
    application_id: beaver
    application_version: 0.10.0
    application_image: daya0576/beaverhabits:0.10.0
    application_host_port: 8082
    application_container_port: 8080
    application_data_path: /var/lib/aggregare/beaver
    application_container_data_path: /app/.user
    application_data_owner: '1000'
    application_data_group: '1000'
    application_user: 1000:1000
    application_environment:
      HABITS_STORAGE: DATABASE
    application_health_path: /
  tasks:
  - name: Apply the shared OCI application role
    ansible.builtin.import_role:
      name: container_app
